name: Package Week03

on:
  pull_request:
    paths:
      - 'Week03/**'
      - '.github/workflows/package-week03.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage current Week03 event projects
        run: |
          mkdir -p dist
          cp -R Week03/Week03_Example01_ActionEvent dist/
          cp -R Week03/Week03_Example02_ItemEvent dist/
          cp -R Week03/Week03_Example03_KeyFocusEvent dist/
          cp -R Week03/Week03_Example04_MouseEvent dist/
          cp -R Week03/Week03_Practice01_LoginEventUpgrade dist/
          cp -R Week03/Week03_Practice02_SignUpEventUpgrade dist/
          cp -R Week03/Week03_Practice03_EventMonitor dist/
          cp Week03/README.md dist/

      - name: Upload complete Week03 package
        uses: actions/upload-artifact@v4
        with:
          name: Week03_EventHandling_EclipseProjects
          path: dist
          include-hidden-files: true

      - name: Upload Example01
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Example01_ActionEvent
          path: Week03/Week03_Example01_ActionEvent
          include-hidden-files: true
      - name: Upload Example02
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Example02_ItemEvent
          path: Week03/Week03_Example02_ItemEvent
          include-hidden-files: true
      - name: Upload Example03
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Example03_KeyFocusEvent
          path: Week03/Week03_Example03_KeyFocusEvent
          include-hidden-files: true
      - name: Upload Example04
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Example04_MouseEvent
          path: Week03/Week03_Example04_MouseEvent
          include-hidden-files: true
      - name: Upload Practice01
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Practice01_LoginEventUpgrade
          path: Week03/Week03_Practice01_LoginEventUpgrade
          include-hidden-files: true
      - name: Upload Practice02
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Practice02_SignUpEventUpgrade
          path: Week03/Week03_Practice02_SignUpEventUpgrade
          include-hidden-files: true
      - name: Upload Practice03
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Practice03_EventMonitor
          path: Week03/Week03_Practice03_EventMonitor
          include-hidden-files: true
      - name: Upload Workbook01
        uses: actions/upload-artifact@v4
        with:
          name: Week03_Workbook01_CourseRegistrationEvent
          path: Week03/Week03_Workbook01_CourseRegistrationEvent
          include-hidden-files: true

