name: Package Week03

on:
  pull_request:
    paths:
      - 'Week03/**'
      - '.github/workflows/package-week03.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Week03 Eclipse project archive
        run: |
          cd Week03
          zip -r ../Week03_EclipseProjects.zip .
      - name: Upload Week03 archive
        uses: actions/upload-artifact@v4
        with:
          name: Week03_EclipseProjects
          path: Week03_EclipseProjects.zip
