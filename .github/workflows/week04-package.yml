name: Week04 Eclipse ZIP Packages

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Week04/**'
      - '.github/workflows/week04-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Example01
        uses: actions/upload-artifact@v4
        with:
          name: Week04_Example09_TextFileRead
          path: Week04/Week04_Example09_TextFileRead
          include-hidden-files: true
          if-no-files-found: error

      - name: Example02
        uses: actions/upload-artifact@v4
        with:
          name: Week04_Example10_TextFileWrite
          path: Week04/Week04_Example10_TextFileWrite
          include-hidden-files: true
          if-no-files-found: error

      - name: Example03
        uses: actions/upload-artifact@v4
        with:
          name: Week04_Example11_BufferedCopy
          path: Week04/Week04_Example11_BufferedCopy
          include-hidden-files: true
          if-no-files-found: error

      - name: Example04
        uses: actions/upload-artifact@v4
        with:
          name: Week04_Example12_GuiTextEditor
          path: Week04/Week04_Example12_GuiTextEditor
          include-hidden-files: true
          if-no-files-found: error

      - name: Practice01
